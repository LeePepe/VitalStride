name: VitalStride
options:
  bundleIdPrefix: com.vitalstride
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    watchOS: "11.0"
  xcodeVersion: "26.5"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: true

targets:
  VitalStride:
    type: application
    platform: iOS
    sources:
      - path: VitalStride/Sources
      - path: VitalStride/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vitalstride.ios
        PRODUCT_NAME: VitalStride
        INFOPLIST_GENERATION_MODE: GeneratedByBuildSystem
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTED_INTERFACE_ORIENTATIONS: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SUPPORTED_INTERFACE_ORIENTATIONS~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

  VitalStrideMac:
    type: application
    platform: macOS
    sources:
      - path: VitalStrideMac/Sources
      - path: VitalStrideMac/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vitalstride.mac
        PRODUCT_NAME: VitalStride
        INFOPLIST_GENERATION_MODE: GeneratedByBuildSystem
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  VitalStrideWatch Watch App:
    type: application
    platform: watchOS
    sources:
      - path: "VitalStrideWatch Watch App/Sources"
      - path: "VitalStrideWatch Watch App/Assets.xcassets"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vitalstride.watchos
        PRODUCT_NAME: "VitalStrideWatch Watch App"
        INFOPLIST_GENERATION_MODE: GeneratedByBuildSystem
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: true
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        SKIP_INSTALL: false
