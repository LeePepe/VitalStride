name: VitalStride
options:
  bundleIdPrefix: com.leepepe
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
    watchOS: "11.0"
  xcodeVersion: "26.5"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    DEVELOPMENT_TEAM: 4Z8GG667QD
    CODE_SIGN_STYLE: Automatic
    # 统一 build number 默认值，CI（fastlane xcargs CURRENT_PROJECT_VERSION=N）覆盖它。
    # 必须只此一处——各 target 若自带硬编码值，会导致 app/extension build number 不一致，
    # App Store 处理阶段拒收（CFBundleVersion of extension must match parent app）。
    CURRENT_PROJECT_VERSION: "1"

packages:
  VitalModels:
    path: Packages/VitalModels
  HealthKitService:
    path: Packages/HealthKitService
  AIService:
    path: Packages/AIService
  VitalUI:
    path: Packages/VitalUI
  TelemetryKit:
    path: Packages/TelemetryKit
  DesignKit:
    path: Packages/DesignKit
  # spec 015-glitchtip-crash-reporting (MY-1311/T002). Remote SPM dependency,
  # attached ONLY to the iOS `VitalStride` target — Mac / Watch / Widgets do
  # not link Sentry (Constitution §VII, ADR-0013). The DSN itself is injected
  # into the generated Info.plist via `INFOPLIST_KEY_GlitchTipDSN` below and
  # read at runtime by `CrashReporting.start`.
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: "8.0.0"

schemes:
  VitalStride:
    build:
      targets:
        VitalStride: all
        VitalStrideTests: [test]
        VitalStrideUITests: [test]
    test:
      targets:
        - VitalStrideTests
        - VitalStrideUITests
  VitalStrideUITests:
    build:
      targets:
        VitalStride: all
        VitalStrideUITests: [test]
    test:
      targets:
        - VitalStrideUITests
  "VitalStrideWatch Watch App":
    build:
      targets:
        "VitalStrideWatch Watch App": all
  VitalStrideWatchTests:
    build:
      targets:
        "VitalStrideWatch Watch App": all
        VitalStrideWatchTests: [test]
    test:
      targets:
        - VitalStrideWatchTests

targets:
  VitalStride:
    type: application
    platform: iOS
    entitlements:
      path: VitalStride/VitalStride.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.leepepe.VitalStride
        com.apple.developer.icloud-services:
          - CloudKit
    sources:
      - path: VitalStride
        excludes:
          - "*.entitlements"
    dependencies:
      - package: VitalModels
      - package: HealthKitService
      - package: AIService
      - package: VitalUI
      - package: TelemetryKit
      - package: TelemetryKit
        product: AptabaseAdapter
      - package: DesignKit
      - package: Sentry
      - sdk: HealthKit.framework
      - target: VitalStrideWidgets
    settings:
      configs:
        # Release/CI archive 走 manual + 显式 App Store profile（fastlane 已拉取安装）。
        # Debug 继承顶层 Automatic，本地 Xcode 调试不受影响。
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: com.leepepe.vitalstride AppStore
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leepepe.vitalstride
        PRODUCT_NAME: VitalStride
        INFOPLIST_GENERATION_MODE: GeneratedByBuildSystem
        MARKETING_VERSION: "1.1"
        GENERATE_INFOPLIST_FILE: true
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTED_INTERFACE_ORIENTATIONS: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        SUPPORTED_INTERFACE_ORIENTATIONS~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # 显式写进生成的 Info.plist —— App Store 上传校验要求主 app bundle 有
        # UISupportedInterfaceOrientations（GeneratedByBuildSystem 模式下上面的
        # SUPPORTED_INTERFACE_ORIENTATIONS build setting 没投影进 plist，报 Invalid bundle）。
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # 声明需要全屏 → 不参与 iPad 分屏多任务，从而不必支持全部 4 个方向
        # （否则 App Store 校验：All interface orientations must be supported
        # unless the app requires full screen）。健身 app 全屏使用，可逆设置。
        INFOPLIST_KEY_UIRequiresFullScreen: true
        INFOPLIST_KEY_NSHealthShareUsageDescription: "VitalStride reads your health and activity data (heart rate, steps, sleep, workout history) to display training history, calculate activity summaries, and provide AI-powered training analysis and recommendations."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "VitalStride writes workout summaries to Apple Health to save Recorded Workouts you complete within the app, keeping your health data complete and consistent across apps."
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_NSSupportsLiveActivities: true
        # TestFlight/App Store: declares the app uses no non-exempt encryption,
        # so each build skips the manual export-compliance prompt. VitalStride
        # only uses HTTPS/standard OS crypto (exempt). See ci/testflight workflow.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        INFOPLIST_KEY_AptabaseAppKey: "$(APTABASE_APP_KEY)"
        INFOPLIST_KEY_AptabaseHost: "$(APTABASE_HOST)"
        # spec 015-glitchtip-crash-reporting (MY-1311/T002). Literal Xcode
        # build-setting variable reference — NOT a real DSN string. CI (MY-1316)
        # supplies `$(GLITCHTIP_DSN)` via fastlane xcargs; local Debug builds
        # leave it empty, and `CrashReporting.start` is a fail-safe no-op when
        # the value is missing.
        INFOPLIST_KEY_GlitchTipDSN: "$(GLITCHTIP_DSN)"

  VitalStrideMac:
    type: application
    platform: macOS
    sources:
      - path: VitalStrideMac
        excludes:
          - "*.entitlements"
      - path: VitalStride/Resources
      - path: VitalStride/Sources/ExerciseSeeder.swift
      - path: VitalStride/Sources/DataView.swift
      - path: VitalStride/Sources/UserInterestTracker.swift
      - path: VitalStride/Sources/HealthSummaryCards.swift
      - path: VitalStride/Sources/Extensions/WorkoutActivityType+Display.swift
      - path: VitalStride/Sources/DataSections
      - path: VitalStride/Sources/UnitPreferencesSection.swift
      - path: VitalStride/Sources/AIView.swift
      - path: VitalStride/Sources/AIQuickAnalysisCard.swift
      - path: VitalStride/Sources/AIPromptBuilder.swift
      - path: VitalStride/Sources/AIChatView.swift
      - path: VitalStride/Sources/AISettingsSection.swift
      - path: VitalStride/Sources/AIDataAnalysisSection.swift
      - path: VitalStride/Sources/AIAnalysisService.swift
      - path: VitalStride/Sources/AIAnalysisContext.swift
      - path: VitalStride/Sources/AIAnalysisPrompts.swift
      - path: VitalStride/Sources/RouterBackedProvider.swift
      - path: VitalStride/Sources/HealthDataCacheEnvironment.swift
      - path: VitalStride/Sources/OnboardingView.swift
      - path: VitalStride/Sources/WorkoutHeartRateStats.swift
    dependencies:
      - package: VitalModels
      - package: HealthKitService
      - package: AIService
      - package: VitalUI
      - package: TelemetryKit
      - package: TelemetryKit
        product: AptabaseAdapter
      - package: DesignKit
      - sdk: HealthKit.framework
    entitlements:
      path: VitalStrideMac/VitalStrideMac.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.leepepe.VitalStride
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leepepe.vitalstride.mac
        PRODUCT_NAME: VitalStride
        INFOPLIST_GENERATION_MODE: GeneratedByBuildSystem
        MARKETING_VERSION: "1.1"
        GENERATE_INFOPLIST_FILE: true
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHealthShareUsageDescription: "VitalStride reads your health and activity data (heart rate, steps, sleep, workout history) to display training history, calculate activity summaries, and provide AI-powered training analysis and recommendations."
        INFOPLIST_KEY_AptabaseAppKey: "$(APTABASE_APP_KEY)"
        INFOPLIST_KEY_AptabaseHost: "$(APTABASE_HOST)"

  VitalStrideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VitalStrideTests
    dependencies:
      - target: VitalStride
      - package: VitalModels
      - package: HealthKitService
      - package: AIService
      - package: TelemetryKit
      - package: DesignKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leepepe.vitalstride.tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VitalStride.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VitalStride"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # UI test bundle for spec 020 (MY-1368/MY-1370). XCUITest verifies the
  # ExercisePicker search field keeps `@FocusState` across debounced content
  # changes and @Query refresh. Depends on the `VitalStride` iOS app target
  # (bundle.ui-testing pattern — no TEST_HOST/BUNDLE_LOADER, uses TEST_TARGET_NAME).
  VitalStrideUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VitalStrideUITests
    dependencies:
      - target: VitalStride
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leepepe.vitalstride.uitests
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: VitalStride

  VitalStrideWatch Watch App:
    type: application
    platform: watchOS
    entitlements:
      path: "VitalStrideWatch Watch App/VitalStrideWatch.entitlements"
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.leepepe.VitalStride
        com.apple.developer.icloud-services:
          - CloudKit
    sources:
      - path: "VitalStrideWatch Watch App"
        excludes:
          - "*.entitlements"
      - path: VitalStride/Resources
        excludes:
          # watch 自带 Resources/*.lproj/InfoPlist.strings（内容相同），
          # 避免与共享份 copy 到同一产物路径冲突（Multiple commands produce）
          - "**/InfoPlist.strings"
      - path: VitalStride/Sources/ExerciseSeeder.swift
    dependencies:
      - package: VitalModels
      - package: HealthKitService
      - package: AIService
      - package: VitalUI
      - package: TelemetryKit
      - package: TelemetryKit
        product: AptabaseAdapter
      - package: DesignKit
      - sdk: HealthKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leepepe.vitalstride.watchos
        PRODUCT_NAME: "VitalStrideWatch Watch App"
        INFOPLIST_GENERATION_MODE: GeneratedByBuildSystem
        MARKETING_VERSION: "1.1"
        GENERATE_INFOPLIST_FILE: true
        SWIFT_EMIT_LOC_STRINGS: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        SKIP_INSTALL: false
        INFOPLIST_KEY_NSHealthShareUsageDescription: "VitalStride reads your health and activity data (heart rate, steps, sleep, workout history) to display training history, calculate activity summaries, and provide AI-powered training analysis and recommendations."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "VitalStride writes workout summaries to Apple Health to save Recorded Workouts you complete within the app, keeping your health data complete and consistent across apps."
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_AptabaseAppKey: "$(APTABASE_APP_KEY)"
        INFOPLIST_KEY_AptabaseHost: "$(APTABASE_HOST)"

  VitalStrideWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: VitalStrideWidgets
        excludes:
          - Info.plist
      - path: VitalStride/Sources/RestTimerAttributes.swift
      - path: VitalStride/Resources/Localizable.xcstrings
    info:
      path: VitalStrideWidgets/Info.plist
      properties:
        # App Store 要求扩展 bundle 必须有 CFBundleDisplayName，否则上传校验
        # 报 90360（Missing Info.plist value）。
        CFBundleDisplayName: VitalStride
        # extension 的 build/version 号必须与父 app 一致，否则 ASC 处理阶段拒收
        # （CFBundleVersion of extension must match parent app）。引用 build setting
        # 让 CI 的 xcargs CURRENT_PROJECT_VERSION=N 同时覆盖 app 与 widget。
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    settings:
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: com.leepepe.vitalstride.widgets AppStore
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leepepe.vitalstride.widgets
        PRODUCT_NAME: VitalStrideWidgets
        MARKETING_VERSION: "1.1"
        SWIFT_EMIT_LOC_STRINGS: true
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../Frameworks"

  # watchOS unit-test bundle covering the MY-1290 display-state projection,
  # HR/connection transition reducers, and the MY-1292 complete-set sender
  # seam. Kept as a stand-alone bundle (`type: bundle.unit-test`) so it can
  # link the watch app for `@testable import` without needing a full-blown
  # host app on the simulator — the target inherits watchOS deployment from
  # the top-level `options.deploymentTarget.watchOS`.
  VitalStrideWatchTests:
    type: bundle.unit-test
    platform: watchOS
    sources:
      - path: VitalStrideWatchTests
    dependencies:
      - target: "VitalStrideWatch Watch App"
      - package: HealthKitService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leepepe.vitalstride.watchos.tests
        GENERATE_INFOPLIST_FILE: true
        # Test bundle links against the watch app so that `@testable import`
        # of watch-target sources works. TEST_HOST + BUNDLE_LOADER mirror
        # the pattern used by `VitalStrideTests`.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/VitalStrideWatch Watch App.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/VitalStrideWatch Watch App"
        BUNDLE_LOADER: "$(TEST_HOST)"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
