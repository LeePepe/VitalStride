name: CI

# Enforcement runs server-side. Two triggers:
#   - pull_request → main: gate PRs BEFORE merge. spm + policy are set as
#     required status checks in branch protection so a red run blocks the merge.
#   - push → main: post-merge safety net (main only lands via merged PRs, but
#     this re-verifies the merged result).
# PR-required workflow: see docs/adr/0009-pr-required-workflow.md + AGENTS.md
# → Git Workflow. Audit: repo-vitalstride.md §4 (3-job CI plan).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Job A (REQUIRED): 6 SPM packages — swift build + test, seconds, no sim ----
  spm:
    name: SPM ${{ matrix.package }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package: [VitalModels, HealthKitService, AIService, VitalUI, TelemetryKit, DesignKit]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: swift build
        working-directory: Packages/${{ matrix.package }}
        run: swift build
      - name: swift test
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  # ---- Job B (REQUIRED): app target — xcodegen + xcodebuild test on iPhone 17 ----
  # This is the sole enforcement point for the app-target full xcodebuild test:
  # pre-push deliberately no longer runs it (that ~92s gate outlived agent-pipeline
  # runs and stalled PR handoff — cf. MY-1150), so merge protection lives here.
  # Runs on macos-26 (Xcode 26.5) to match the local toolchain: the app-target
  # tests hit Swift-6 actor-isolation compile errors under the older Xcode 16.4
  # on macos-15, which is why this job could never go green / required before.
  # Known-flaky OverviewHealthSnapshotTests.loadAllMetrics is quarantined via
  # retry-until-green so green CI != flake masking. Drop the quarantine +
  # -skip-testing once G-09 is fixed.
  app:
    name: App target
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: xcodebuild test (flake quarantined via retry)
        run: |
          set -o pipefail
          QUARANTINE="OverviewHealthSnapshotTests/loadAllMetrics"
          attempt=1
          max=3
          until [ "$attempt" -gt "$max" ]; do
            echo "::group::xcodebuild test attempt $attempt/$max"
            # Full output saved to a log so compile errors aren't lost to `tail`
            # (a truncated tail hid the real actor-isolation errors during triage).
            if xcodebuild test \
                 -project VitalStride.xcodeproj \
                 -scheme VitalStride \
                 -destination 'platform=iOS Simulator,name=iPhone 17' \
                 -skipPackagePluginValidation \
                 -skip-testing:"VitalStrideTests/$QUARANTINE" \
                 2>&1 | tee /tmp/xcb-attempt-$attempt.log | tail -60; then
              echo "::endgroup::"
              echo "xcodebuild test passed on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            attempt=$((attempt + 1))
          done
          echo "xcodebuild test failed after $max attempts"
          echo "::group::compile/test errors (grepped from full log)"
          grep -E "error:|Testing failed|actor-isolated|BUILD FAILED|Unable to find" /tmp/xcb-attempt-*.log | sort -u | head -60 || true
          echo "::endgroup::"
          exit 1

  # ---- Job C (REQUIRED): lint + policy gates (mirrors pre-push, server-side) ----
  policy:
    name: Lint & policy
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      # Secret scan (required): block hardcoded API keys / tokens / passwords.
      # Real risk surface — Keychain + Zhipu API key handling. Test-fixture
      # fake keys are allowlisted in .gitleaks.toml (verified: no false red).
      - name: Install gitleaks
        run: brew install gitleaks
      - name: gitleaks detect (required, full history)
        run: gitleaks detect --no-banner --config .gitleaks.toml --redact
      - name: Install SwiftLint
        run: brew install swiftlint
      # SwiftLint --strict is a REQUIRED blocking gate. The ~602 pre-existing
      # no_hardcoded_chinese violations (app-target i18n debt, tracked MY-1065)
      # are grandfathered via .swiftlint-baseline.json, so CI blocks only NEW
      # violations without a mass red-out. Regenerate the baseline as debt is
      # paid: `swiftlint lint --write-baseline .swiftlint-baseline.json`.
      # Scopes come from .swiftlint.yml `included:` (app targets + Packages).
      - name: SwiftLint --strict (required, blocks on new violations)
        run: swiftlint lint --strict --baseline .swiftlint-baseline.json
      # HealthKit values must never reach logs (privacy compliance)
      - name: No HealthKit values in logs
        run: |
          set -uo pipefail
          MATCHES=$(grep -rnE '(os_log|Logger|print|NSLog)[^"]*"[^"]*\\\((heartRate|hrv|restingHeartRate|stepCount|steps|calories|activeEnergy|bodyMass|weight|distance|sleep|bloodGlucose|spo2|oxygen|vo2|sample\.value|quantity)' \
            --include='*.swift' VitalStride VitalStrideMac "VitalStrideWatch Watch App" Packages 2>/dev/null || true)
          if [ -n "$MATCHES" ]; then
            echo "Blocked: HealthKit values must not appear in logs (privacy):"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK: no HealthKit values logged."
      # RepoInfra owns policy/tooling and validates exhaustive layer coverage,
      # shell/Python syntax, and its tests without invoking app xcodebuild.
      - name: RepoInfra fast validation
        run: bash scripts/test-repoinfra.sh
      - name: Prototype layer build
        run: swift build --package-path Prototype
      - name: Exercise catalog muscle validation
        run: python3 scripts/validate_exercise_muscles.py
      # Regression coverage for the shared review prompt (scripts/ci/review-prompt.md,
      # consumed by both the claude and codex review gates). Locks: the
      # imperative-vs-declarative distinction (so legitimate report fields like
      # `## 结论: PASS` are not mis-classified as injection while actual override
      # attempts remain blockers), the review-gate self-config exemption, the
      # TEMP-PRELAUNCH controlled exception and its boundary, and that backtick
      # content survives rendering intact.
      - name: review prompt contract regression
        run: bash scripts/ci/review-prompt.contract.test.sh
      # 两道 review 门调用 CLI 时必须提供 stdin。codex 即使已拿到 prompt 位置
      # 参数仍会读 stdin;CI step 没有 EOF → 无限阻塞 → job timeout 后报
      # `cancelled`,日志上长得跟「正在认真审一个大 diff」一模一样。
      # PR #391 因此连挂两次、白等 40 分钟才定位。
      - name: review CLI stdin contract regression
        run: bash scripts/ci/review-cli-stdin.contract.test.sh
      # Large diffs containing multi-byte text must be truncated on a valid
      # UTF-8 boundary so both required review gates can render their prompt.
      - name: review UTF-8 truncation contract regression
        run: bash scripts/ci/review-utf8-truncation.contract.test.sh
      # spec 019 FR-017 / SC-007 ship-gate。Stage 6e 已把 RoutingSignalEntry 的
      # raw 调试字段与全部写入点清零,受控临时例外窗口就此关闭 —— 这道 enforce
      # 门是清零之后唯一的防回归护栏:任何 PR 重新引入 `TEMP-PRELAUNCH` 直接红。
      # 注意 testflight.yml 仍用 `audit`,那是两种「发布前」语义,不要一起改:
      # 见 scripts/ci/scan-temp-prelaunch.sh 头部注释与 docs/ci-gates.md。
      - name: TEMP-PRELAUNCH ship-gate (enforce)
        run: bash scripts/ci/scan-temp-prelaunch.sh enforce
