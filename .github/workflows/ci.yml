name: CI

# No-PR workflow: enforcement runs server-side on every push to main
# (FS pushes agent/* to a local bare repo; TL advances github/main).
# See AGENTS.md → Git Workflow. Audit: repo-vitalstride.md §4 (3-job CI plan).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Job A (REQUIRED): 5 SPM packages — swift build + test, seconds, no sim ----
  spm:
    name: SPM ${{ matrix.package }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package: [VitalModels, HealthKitService, AIService, VitalUI, TelemetryKit]
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: swift build
        working-directory: Packages/${{ matrix.package }}
        run: swift build
      - name: swift test
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  # ---- Job B (ADVISORY): app target — xcodegen + xcodebuild test on iPhone 16 ----
  # Known-flaky OverviewHealthSnapshotTests.loadAllMetrics is quarantined via
  # retry-until-green so green CI != flake masking. Drop continue-on-error +
  # quarantine once G-09 is fixed, then move this to required.
  app:
    name: App target (advisory)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: xcodebuild test (flake quarantined via retry)
        run: |
          set -o pipefail
          QUARANTINE="OverviewHealthSnapshotTests/loadAllMetrics"
          attempt=1
          max=3
          until [ "$attempt" -gt "$max" ]; do
            echo "::group::xcodebuild test attempt $attempt/$max"
            if xcodebuild test \
                 -project VitalStride.xcodeproj \
                 -scheme VitalStride \
                 -destination 'platform=iOS Simulator,name=iPhone 16' \
                 -skipPackagePluginValidation \
                 -skip-testing:"VitalStrideTests/$QUARANTINE" \
                 | tail -40; then
              echo "::endgroup::"
              echo "xcodebuild test passed on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            attempt=$((attempt + 1))
          done
          echo "xcodebuild test failed after $max attempts"
          exit 1

  # ---- Job C (REQUIRED): lint + policy gates (mirrors pre-push, server-side) ----
  policy:
    name: Lint & policy
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SwiftLint
        run: brew install swiftlint
      # SwiftLint --strict is a REQUIRED blocking gate. The ~602 pre-existing
      # no_hardcoded_chinese violations (app-target i18n debt, tracked MY-1065)
      # are grandfathered via .swiftlint-baseline.json, so CI blocks only NEW
      # violations without a mass red-out. Regenerate the baseline as debt is
      # paid: `swiftlint lint --write-baseline .swiftlint-baseline.json`.
      # Scopes come from .swiftlint.yml `included:` (app targets + Packages).
      - name: SwiftLint --strict (required, blocks on new violations)
        run: swiftlint lint --strict --baseline .swiftlint-baseline.json
      # HealthKit values must never reach logs (privacy compliance)
      - name: No HealthKit values in logs
        run: |
          set -uo pipefail
          MATCHES=$(grep -rnE '(os_log|Logger|print|NSLog)[^"]*"[^"]*\\\((heartRate|hrv|restingHeartRate|stepCount|steps|calories|activeEnergy|bodyMass|weight|distance|sleep|bloodGlucose|spo2|oxygen|vo2|sample\.value|quantity)' \
            --include='*.swift' VitalStride VitalStrideMac "VitalStrideWatch Watch App" Packages 2>/dev/null || true)
          if [ -n "$MATCHES" ]; then
            echo "Blocked: HealthKit values must not appear in logs (privacy):"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK: no HealthKit values logged."
      # Layer frontmatter must stay consistent with code (anti-rot)
      - name: Layer frontmatter anti-rot check
        run: bash scripts/check-frontmatter.sh
