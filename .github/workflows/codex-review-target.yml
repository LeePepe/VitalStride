name: codex-review-target

# Trusted pull_request_target evaluated from the default branch.
# Calls pinned shared-ci reusable review and enforces success in a hosted completion job.
# Trusted base checkout (ref: ${{ github.event.pull_request.base.sha }}) is performed by the reusable workflow.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codex-review-target-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  codex-review:
    uses: LeePepe/shared-ci/.github/workflows/codex-review.yml@6e354f476bc53d68f0f09fc231d5cd938466af9c
    with:
      runs-on: '["self-hosted", "vitalstride-mac"]'
      codex-bin: /opt/homebrew/bin/codex
      rules-file: docs/codex-review-rules.md
      timeout-minutes: 25

  codex-review-target:
    if: ${{ always() }}
    needs: [codex-review]
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - name: Require completed Codex review
        shell: sh
        env:
          CODEX_RESULT: ${{ needs.codex-review.result }}
        run: |
          case "${CODEX_RESULT:-}" in
            success)
              echo "Codex review completed successfully."
              ;;
            *)
              echo "::error::Codex review must complete with success; result '${CODEX_RESULT:-}' cannot pass."
              exit 1
              ;;
          esac
