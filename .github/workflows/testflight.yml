name: testflight

# TestFlight release workflow for VitalStride.
# Triggers automatically on pushes to main after merge; also supports manual workflow_dispatch.
# Runs on self-hosted `vitalstride-mac`.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: '忽略"无新提交"检查，强制发一次'
        type: boolean
        default: false

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  release:
    name: Build & upload to TestFlight
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: [self-hosted, vitalstride-mac]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether to release
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_REF: ${{ github.ref }}
          PUSH_SHA: ${{ github.sha }}
          FORCE_INPUT: ${{ github.event.inputs.force }}
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          set -euo pipefail
          python3 - <<'PY_GATE'
          import os
          import re
          import subprocess
          import sys

          event_name = os.environ.get("EVENT_NAME", "")
          push_ref = os.environ.get("PUSH_REF", "")
          push_sha = os.environ.get("PUSH_SHA", "")
          force_input = os.environ.get("FORCE_INPUT", "").lower() in ("true", "1", "yes")
          run_url = os.environ.get("RUN_URL", "")

          github_output = os.environ.get("GITHUB_OUTPUT", "")
          github_step_summary = os.environ.get("GITHUB_STEP_SUMMARY", "")

          def write_output(key, val):
              if github_output:
                  with open(github_output, "a", encoding="utf-8") as f:
                      f.write(f"{key}={val}\n")

          def write_summary(lines):
              if github_step_summary:
                  with open(github_step_summary, "a", encoding="utf-8") as f:
                      f.write("\n".join(lines) + "\n")

          def is_endpoint_relevant(p: str) -> bool:
              p = p.strip("/").replace("\\", "/")
              if (
                  p.endswith(".md")
                  or p == "CONTEXT.md"
                  or p.endswith("/CONTEXT.md")
                  or p.startswith("docs/")
                  or p.startswith("specs/")
                  or p.startswith(".github/")
                  or p.startswith("Prototype/")
                  or p.startswith("VitalStride.xcodeproj/")
                  or p.startswith("VitalStrideTests/")
                  or p.startswith("VitalStrideUITests/")
                  or p.startswith("VitalStrideWatchTests/")
                  or p.startswith("scripts/")
                  or p.startswith("design/")
                  or p.startswith(".specify/")
                  or re.match(r"^Packages/[^/]+/Tests/", p)
              ):
                  return False

              if p in ("project.yml", "fastlane/Fastfile", "fastlane/Appfile"):
                  return True

              if re.match(r"^Packages/[^/]+/Package\.swift$", p):
                  return True
              if re.match(r"^Packages/[^/]+/(Sources|Plugins)/", p):
                  return True

              if re.match(r"^(VitalStride|VitalStrideMac|VitalStrideWatch Watch App)/(Sources|Resources|Assets\.xcassets)/", p):
                  return True
              if re.match(r"^(VitalStride|VitalStrideMac|VitalStrideWatch Watch App)/[^/]+\.entitlements$", p):
                  return True

              if p.startswith("VitalStrideWidgets/"):
                  if p.endswith(".swift") or p.endswith(".plist") or p.endswith(".entitlements"):
                      return True
                  if ".xcassets/" in p or p.endswith(".xcassets"):
                      return True

              return False

          def classify_diff(baseline: str, candidate: str) -> tuple[bool, list[str]]:
              cmd = ["git", "diff-tree", "-r", "-z", "--no-commit-id", "-C", "-C", "--find-copies-harder", baseline, candidate]
              res = subprocess.run(cmd, capture_output=True, check=True)
              raw = res.stdout
              if not raw:
                  return False, []

              tokens = raw.split(b"\x00")
              relevant_paths = []
              i = 0
              while i < len(tokens):
                  token = tokens[i].decode("utf-8", errors="replace")
                  if not token:
                      i += 1
                      continue
                  parts = token.split()
                  status = parts[-1] if parts else ""
                  i += 1
                  if i >= len(tokens):
                      break
                  path1 = tokens[i].decode("utf-8", errors="replace")
                  i += 1
                  if status.startswith("R") or status.startswith("C"):
                      if i < len(tokens):
                          path2 = tokens[i].decode("utf-8", errors="replace")
                          i += 1
                          if is_endpoint_relevant(path1) or is_endpoint_relevant(path2):
                              relevant_paths.append(path2 or path1)
                  else:
                      if is_endpoint_relevant(path1):
                          relevant_paths.append(path1)

              return len(relevant_paths) > 0, relevant_paths

          # Capture Candidate
          if event_name == "push":
              if push_ref != "refs/heads/main":
                  write_output("release", "false")
                  write_output("reason", "unsupported-source-event")
                  write_output("candidate", push_sha or "none")
                  write_summary([
                      "### TestFlight Release Gate: Skipped",
                      f"- **Candidate**: `{push_sha}`",
                      "- **Source**: `automatic-push`",
                      "- **Decision**: `skip`",
                      "- **Reason**: `unsupported-source-event`",
                  ])
                  sys.exit(0)
              candidate = push_sha
              source = "automatic-push"
          elif event_name == "workflow_dispatch":
              candidate = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
              source = "manual"
          else:
              write_output("release", "false")
              write_output("reason", "unsupported-event")
              write_output("candidate", "none")
              sys.exit(0)

          # Fetch remote tags and check marker
          subprocess.run(["git", "fetch", "--tags", "origin"], check=False)
          tag_res = subprocess.run(["git", "rev-parse", "-q", "--verify", "refs/tags/testflight/last-released"], capture_output=True, text=True)
          if tag_res.returncode == 0 and tag_res.stdout.strip():
              marker_sha = tag_res.stdout.strip()
          else:
              marker_sha = None

          if not marker_sha:
              write_output("release", "false")
              write_output("reason", "marker-missing")
              write_output("candidate", candidate)
              write_summary([
                  "### TestFlight Release Gate: Failed",
                  f"- **Candidate**: `{candidate}`",
                  "- **Marker**: `none (missing)`",
                  "- **Reason**: `marker-missing`",
              ])
              print("::error::Marker tag testflight/last-released is missing.")
              sys.exit(1)

          is_commit = subprocess.run(["git", "rev-parse", "--verify", f"{marker_sha}^{{commit}}"], capture_output=True)
          if is_commit.returncode != 0:
              write_output("release", "false")
              write_output("reason", "marker-invalid")
              write_output("candidate", candidate)
              write_summary([
                  "### TestFlight Release Gate: Failed",
                  f"- **Candidate**: `{candidate}`",
                  f"- **Marker**: `{marker_sha}` (invalid/non-commit)",
                  "- **Reason**: `marker-invalid`",
              ])
              print(f"::error::Marker tag testflight/last-released ({marker_sha}) is not a valid commit.")
              sys.exit(1)

          is_force = (source == "manual" and force_input)

          if candidate == marker_sha and not is_force:
              write_output("release", "false")
              write_output("reason", "already-covered")
              write_output("candidate", candidate)
              write_summary([
                  "### TestFlight Release Gate: Skipped",
                  f"- **Candidate**: `{candidate}`",
                  f"- **Marker**: `{marker_sha}`",
                  "- **Decision**: `skip`",
                  "- **Reason**: `already-covered`",
              ])
              print(f"Candidate {candidate} is identical to marker {marker_sha}. Skipping.")
              sys.exit(0)

          is_ancestor = subprocess.run(["git", "merge-base", "--is-ancestor", marker_sha, candidate]).returncode == 0
          if not is_ancestor:
              write_output("release", "false")
              write_output("reason", "marker-invalid")
              write_output("candidate", candidate)
              write_summary([
                  "### TestFlight Release Gate: Failed",
                  f"- **Candidate**: `{candidate}`",
                  f"- **Marker**: `{marker_sha}`",
                  "- **Reason**: `marker-invalid`",
              ])
              print(f"::error::Marker {marker_sha} is not an ancestor of candidate {candidate}.")
              sys.exit(1)

          if is_force:
              release = True
              reason = "force"
              relevant_paths = []
          else:
              # Range evaluation: marker..candidate
              has_relevant_changes, relevant_paths = classify_diff(marker_sha, candidate)

              if has_relevant_changes:
                  release = True
                  reason = "eligible"
              else:
                  release = False
                  reason = "path-ineligible"

          write_output("release", "true" if release else "false")
          write_output("reason", reason)
          write_output("candidate", candidate)
          write_output("source", source)

          decision_str = "release" if release else "skip"
          summary_lines = [
              f"### TestFlight Release Gate: {'Release' if release else 'Skipped'}",
              f"- **Candidate**: `{candidate}`",
              f"- **Source**: `{source}`",
              f"- **Marker**: `{marker_sha}`",
              f"- **Relevant paths found**: {len(relevant_paths)}",
              f"- **Decision**: `{decision_str}`",
              f"- **Reason code**: `{reason}`",
          ]
          if run_url:
              summary_lines.append(f"- **Run URL**: {run_url}")
          write_summary(summary_lines)

          if release:
              print(f"→ Releasing candidate {candidate} (reason: {reason})")
              subprocess.run(["git", "checkout", candidate], check=True)
          else:
              print(f"→ Skipped: {reason}")
          PY_GATE

      - name: Verify Xcode
        if: steps.gate.outputs.release == 'true'
        run: |
          echo "Using: $(xcode-select -p)"
          xcodebuild -version

      - name: Ensure fastlane
        if: steps.gate.outputs.release == 'true'
        run: brew list fastlane >/dev/null 2>&1 || brew install fastlane

      - name: Write API key
        if: steps.gate.outputs.release == 'true'
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_KEY_P8_BASE64:-}" ]; then
            echo "::error::ASC_KEY_P8_BASE64 secret 未设置" ; exit 1
          fi

      - name: Unlock login keychain for codesign
        if: steps.gate.outputs.release == 'true'
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYCHAIN_PASSWORD:-}" ]; then
            echo "::error::KEYCHAIN_PASSWORD secret 未设置（gh secret set KEYCHAIN_PASSWORD）"; exit 1
          fi
          KC="$HOME/Library/Keychains/login.keychain-db"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings "$KC"
          EXISTING=$(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"$//')
          # shellcheck disable=SC2086,SC2046
          security list-keychains -d user -s $(printf '%s\n' "$KC" $EXISTING | awk '!seen[$0]++')
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KC" >/dev/null 2>&1 || true

      - name: Audit — TEMP-PRELAUNCH exceptions (non-blocking for internal TestFlight)
        if: steps.gate.outputs.release == 'true'
        run: bash scripts/ci/scan-temp-prelaunch.sh audit

      - name: fastlane beta
        if: steps.gate.outputs.release == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "120"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "6"
          GLITCHTIP_DSN: ${{ secrets.GLITCHTIP_DSN }}
          APTABASE_APP_KEY: ${{ secrets.APTABASE_APP_KEY }}
          APTABASE_HOST: ${{ secrets.APTABASE_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${GLITCHTIP_DSN:-}" ]; then
            echo "::error::GLITCHTIP_DSN secret 未设置" ; exit 1
          fi
          fastlane ios beta

      - name: Install sentry-cli
        if: steps.gate.outputs.release == 'true'
        continue-on-error: true
        run: brew list sentry-cli >/dev/null 2>&1 || brew install getsentry/tools/sentry-cli

      - name: Upload dSYMs to GlitchTip
        if: steps.gate.outputs.release == 'true'
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.GLITCHTIP_AUTH_TOKEN }}
          SENTRY_URL: ${{ secrets.GLITCHTIP_URL }}
          SENTRY_ORG: vitalstride
          SENTRY_PROJECT: vitalstride-ios
        run: |
          set -euo pipefail
          DSYM_ZIP="$RUNNER_TEMP/VitalStride.app.dSYM.zip"
          if [ ! -f "$DSYM_ZIP" ]; then
            echo "::warning::dSYM zip not found at $DSYM_ZIP; skipping upload"
            exit 0
          fi
          sentry-cli debug-files upload --include-sources "$DSYM_ZIP"

      - name: Move last-released tag
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${{ steps.gate.outputs.candidate }}"
          git tag -f testflight/last-released "$SHA"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/testflight/last-released"
          echo "✅ testflight/last-released → $SHA"
